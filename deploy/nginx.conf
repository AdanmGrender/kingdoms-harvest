# Kingdoms Harvest - Nginx Configuration
# IMPORTANTE: Reemplazar TUDOMINIO.COM con tu dominio real antes de usar
#
# CRITICAL — leer antes de editar:
#   Phaser preload-ea ~140 PNGs simultaneos al boot. Servir esas PNG via
#   proxy_pass al Node con rate-limiting deja huecos visuales (cuadrados
#   negros, sprites incompletos). El bloque `location /assets/` sirve los
#   archivos directo desde disco (alias) sin pasar por Node y sin
#   rate-limit. Cualquier cambio que vuelva a meter /assets/ por proxy
#   debe quitar el rate-limit O servir desde disco igual.

server {
    listen 80;
    server_name TUDOMINIO.COM www.TUDOMINIO.COM;

    # Certbot ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name TUDOMINIO.COM www.TUDOMINIO.COM;

    # SSL certs - certbot las agrega automáticamente con:
    # certbot --nginx -d TUDOMINIO.COM -d www.TUDOMINIO.COM
    # ssl_certificate     /etc/letsencrypt/live/TUDOMINIO.COM/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TUDOMINIO.COM/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # === Static assets — directo desde disco, sin proxy, sin rate-limit ===
    # Phaser preload-ea ~140 PNGs al mismo tiempo. Si pasan por proxy +
    # rate-limit, random fails → cuadrados negros + sprites incompletos.
    location /assets/ {
        alias /home/kingdoms/app/client/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy principal (API + SPA fallback)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Socket.io - WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
